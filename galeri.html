<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lihat foto dan momen kebersamaan mahasiswa kelas MI.25.R1 AMIK ITMI." />
  <meta name="theme-color" content="#ffe000" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Galeri | MI.25.R1 AMIK ITMI" />
  <meta property="og:description" content="Galeri foto kelas MI.25.R1 AMIK ITMI." />
  <title>Galeri | MI.25.R1 AMIK ITMI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="class-home">
  <header class="class-page-hero">
    <a class="campus-logo" href="index.html" aria-label="Kembali ke Home">
      <img src="assets/logokampus.png" alt="Logo AMIK ITMI" />
    </a>
    <div class="class-hero-content">
      <span class="class-kicker">MI.25.R1 AMIK ITMI</span>
      <h1>Galeri Kelas</h1>
      <p>Momen kebersamaan kelas kami.</p>
    </div>
  </header>

  <nav aria-label="Navigasi utama">
    <a href="index.html">Home</a>
    <a href="tentang.html">About Us</a>
    <a href="galeri.html" aria-current="page">Galeri</a>
  </nav>

  <main>
    <section class="class-section gallery-section">
      <div class="class-section-inner">
        <div class="gallery-toolbar">
          <div>
            <span class="section-eyebrow">CERITA KELAS KAMI</span>
            <h2>Foto-Foto Kami</h2>
          </div>
          <button class="class-button class-button-dark" id="addPhotoBtn" type="button">Tambah Foto</button>
          <input id="galleryImageInput" type="file" accept="image/*" multiple hidden />
        </div>
        <div class="class-gallery" id="classGallery" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <dialog class="photo-viewer" id="photoViewer" aria-label="Tampilan foto kelas">
    <div class="photo-viewer-topline">
      <span id="photoCounter" aria-live="polite"></span>
      <button class="photo-viewer-icon" id="closePhotoViewer" type="button" aria-label="Tutup foto">&times;</button>
    </div>
    <div class="photo-viewer-stage">
      <button class="photo-viewer-icon" id="previousPhoto" type="button" aria-label="Foto sebelumnya">&lsaquo;</button>
      <img id="photoViewerImage" alt="" />
      <button class="photo-viewer-icon" id="nextPhoto" type="button" aria-label="Foto berikutnya">&rsaquo;</button>
    </div>
    <p id="photoCaption"></p>
  </dialog>

  <div class="class-music-player" aria-label="Pemutar musik kelas">
    <audio id="storeMusic" loop preload="metadata"></audio>
    <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false">Putar musik</button>
  </div>

  <footer>
    <p>&copy; 2026 MI.25.R1 AMIK ITMI</p>
  </footer>
  <script src="class-ui.js"></script>
  <script>
    const STORAGE_KEY = 'mi25r1-class-gallery';
    const defaultPhotos = [
      {
        src: 'assets/fotokamii.jpeg',
        alt: 'Foto kelas MI.25.R1, foto 1',
        title: 'Kumpul kelas bersama',
        caption: 'Foto ini menampilkan suasana kebersamaan saat seluruh mahasiswa MI.25.R1 sedang berkumpul dan saling berinteraksi di kelas.'
      },
      {
        src: 'assets/fotokami2.jpg',
        alt: 'Foto kelas MI.25.R1, foto 2',
        title: 'Diskusi santai',
        caption: 'Kami sedang berdiskusi dan belajar bersama sambil menciptakan suasana kelas yang akrab dan nyaman.'
      },
      {
        src: 'assets/fotokami3.jpg',
        alt: 'Foto kelas MI.25.R1, foto 3',
        title: 'Posing bersama',
        caption: 'Moment kebersamaan yang ditangkap saat kami semua berfoto setelah kegiatan belajar di kelas.'
      },
      {
        src: 'assets/fotokami4.jpg',
        alt: 'Foto kelas MI.25.R1, foto 4',
        title: 'Belajar antusias',
        caption: 'Salah satu momen kami fokus belajar dan saling mendukung dalam mengikuti materi perkuliahan.'
      },
      {
        src: 'assets/fotokami5.jpg',
        alt: 'Foto kelas MI.25.R1, foto 5',
        title: 'Senyum kelas',
        caption: 'Rangkaian momen bahagia yang memperlihatkan semangat kebersamaan di antara para mahasiswa.'
      },
      {
        src: 'assets/fotokami6.jpg',
        alt: 'Foto kelas MI.25.R1, foto 6',
        title: 'Momen kelas',
        caption: 'Suasana kelas yang hangat dan penuh energi, cocok untuk menggambarkan dinamika kami sehari-hari.'
      },
      {
        src: 'assets/fotokami7.jpg',
        alt: 'Foto kelas MI.25.R1, foto 7',
        title: 'Semangat belajar',
        caption: 'Foto ini menggambarkan semangat kami dalam belajar, tetap fokus, dan satu tujuan di dalam kelas.'
      },
      {
        src: 'assets/fotokami8.jpg',
        alt: 'Foto kelas MI.25.R1, foto 8',
        title: 'Kebersamaan kelas',
        caption: 'Kami menikmati waktu bersama tanpa beban, menjadikan kelas ini tempat yang terasa hangat dan dekat.'
      },
      {
        src: 'assets/fotokami9.jpg',
        alt: 'Foto kelas MI.25.R1, foto 9',
        title: 'Kenangan bersama',
        caption: 'Foto ini menjadi kenangan penting bagi kami yang mencerminkan kebersamaan dan persahabatan di MI.25.R1.'
      }
    ];

    function normalizePhoto(photo) {
      return {
        src: photo.src,
        alt: photo.alt || 'Foto kelas MI.25.R1',
        title: photo.title || 'Foto kelas MI.25.R1',
        caption: photo.caption || 'Foto kelas MI.25.R1'
      };
    }

    function getSavedPhotos() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (stored && !Array.isArray(stored) && stored.version === 2 && Array.isArray(stored.photos)) {
          return stored.photos.map(normalizePhoto);
        }

        const uploadedPhotos = Array.isArray(stored) ? stored.map(normalizePhoto) : [];
        return [...uploadedPhotos, ...defaultPhotos.map(normalizePhoto)];
      } catch (error) {
        return defaultPhotos.map(normalizePhoto);
      }
    }

    function savePhotos(photos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, photos }));
    }

    async function loadGallery() {
      const gallery = document.getElementById('classGallery');
      if (!gallery) return;

      const photos = getSavedPhotos();

      gallery.innerHTML = photos.map((photo, index) => `
        <figure class="gallery-card" data-gallery-index="${index}">
          <div class="gallery-image-wrap">
            <img src="${photo.src}" alt="${photo.alt}" data-gallery-index="${index}" data-title="${photo.title}" data-caption="${photo.caption}" loading="lazy" />
            <button class="gallery-delete-btn" type="button" data-delete-index="${index}" aria-label="Hapus foto ${photo.title}">×</button>
          </div>
          <figcaption>
            <strong>${photo.title}</strong>
            <span>${photo.caption}</span>
            <button class="gallery-edit-btn" type="button" data-edit-index="${index}">Edit</button>
          </figcaption>
        </figure>
      `).join('');

      gallery.querySelectorAll('.gallery-delete-btn').forEach((button) => {
        button.addEventListener('click', (event) => {
          const targetIndex = Number(event.currentTarget.dataset.deleteIndex);
          const allPhotos = getSavedPhotos();
          const updatedPhotos = allPhotos.filter((_, index) => index !== targetIndex);

          savePhotos(updatedPhotos);
          loadGallery();
        });
      });

      gallery.querySelectorAll('.gallery-edit-btn').forEach((button) => {
        button.addEventListener('click', (event) => {
          const targetIndex = Number(event.currentTarget.dataset.editIndex);
          const allPhotos = getSavedPhotos();
          const selectedPhoto = allPhotos[targetIndex];

          if (!selectedPhoto) return;

          const updatedTitle = window.prompt('Edit judul foto:', selectedPhoto.title || 'Foto kelas MI.25.R1');
          if (updatedTitle === null) return;

          const updatedCaption = window.prompt('Edit deskripsi foto:', selectedPhoto.caption || 'Foto ini menampilkan kegiatan kelas kami.');
          if (updatedCaption === null) return;

          const updatedPhoto = {
            ...selectedPhoto,
            title: updatedTitle.trim() || selectedPhoto.title || 'Foto kelas MI.25.R1',
            caption: updatedCaption.trim() || selectedPhoto.caption || 'Foto ini menampilkan kegiatan kelas kami.'
          };

          const nextPhotos = allPhotos.map((photo, index) => index === targetIndex ? updatedPhoto : photo);
          savePhotos(nextPhotos);
          loadGallery();
        });
      });

      if (typeof window.refreshGallery === 'function') {
        window.refreshGallery();
      }
    }

    async function compressImage(file) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      const context = canvas.getContext('2d');

      if (!context) {
        bitmap.close();
        throw new Error('Browser tidak dapat memproses gambar.');
      }

      context.fillStyle = '#fff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();
      return canvas.toDataURL('image/jpeg', 0.82);
    }

    function addPhotoFiles(files) {
      const savedPhotos = getSavedPhotos();
      const titlePrompt = window.prompt('Judul foto (opsional):', 'Foto kelas MI.25.R1');
      const captionPrompt = window.prompt('Deskripsi foto:', 'Foto ini menampilkan kegiatan kelas kami saat sedang belajar bersama.');
      const fileReaders = Array.from(files)
        .filter((file) => file.type.startsWith('image/'))
        .map(async (file) => ({
            src: await compressImage(file),
            alt: file.name.replace(/\.[^/.]+$/, '') || 'Foto kelas MI.25.R1',
            title: titlePrompt?.trim() || 'Foto kelas MI.25.R1',
            caption: captionPrompt?.trim() || 'Foto ini menampilkan kegiatan kelas kami saat sedang belajar bersama.'
          }));

      Promise.all(fileReaders)
        .then((newPhotos) => {
          const merged = [...savedPhotos, ...newPhotos.map(normalizePhoto)];
          savePhotos(merged);
          loadGallery();
        })
        .catch(() => {
          alert('Beberapa foto gagal ditambahkan. Coba pilih file gambar lagi.');
        });
    }

    document.getElementById('addPhotoBtn')?.addEventListener('click', () => {
      document.getElementById('galleryImageInput')?.click();
    });

    document.getElementById('galleryImageInput')?.addEventListener('change', (event) => {
      if (event.target.files?.length) {
        addPhotoFiles(event.target.files);
        event.target.value = '';
      }
    });

    loadGallery();
  </script>
  <script src="music.js"></script>
</body>
</html>
